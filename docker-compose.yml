services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vitabridge
      POSTGRES_PASSWORD: vitabridge123
      POSTGRES_DB: vitabridge
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://vitabridge:vitabridge123@db:5432/vitabridge
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on: [db]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes: { pgdata: {} }
