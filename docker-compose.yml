services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vitabridge-ai-api:azure-staging
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-azure-staging}
      AZURE_REGION: uaecentral
      DATA_RESIDENCY_REGION: uaecentral
      CLINICAL_AI_ENABLED: "true"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the UAE-hosted PostgreSQL service}
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET outside source control}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?Set a separate audit HMAC key outside source control}
      SPEECH_MODEL_ENABLED: "false"
      WHISPER_MODEL_PATH: /models/whisper-large-v3.pt
    volumes:
      - ${MODEL_DIR:-./models}:/models:ro
    restart: unless-stopped
